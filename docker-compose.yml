services:
  database:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: know_your_lease
      POSTGRES_USER: lease_user
      POSTGRES_PASSWORD: lease_password
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - lease_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lease_user -d know_your_lease"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://lease_user:lease_password@database:5432/know_your_lease
      DOCUMENT_STORAGE_BACKEND: local
      ENVIRONMENT: development
      PDF_STORAGE_DIR: /app/storage
      PORT: 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - lease_pdf_storage:/app/storage
    depends_on:
      database:
        condition: service_healthy

volumes:
  lease_postgres_data:
  lease_pdf_storage:
