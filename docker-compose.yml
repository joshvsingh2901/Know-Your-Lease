services:
  database:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: know_your_lease
      POSTGRES_USER: lease_user
      POSTGRES_PASSWORD: lease_password
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - lease_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lease_user -d know_your_lease"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lease_postgres_data:
