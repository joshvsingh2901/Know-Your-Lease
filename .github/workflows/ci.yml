name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      AUTH_MODE: disabled
      ENVIRONMENT: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt --constraint requirements.lock

      - name: Check dependency integrity
        run: python -m pip check

      - name: Run Ruff
        run: ruff check .

      - name: Run backend tests
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
      VERCEL_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  migrations:
    name: Database/Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_DB: know_your_lease_ci
          POSTGRES_USER: lease_ci
          POSTGRES_PASSWORD: lease_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lease_ci -d know_your_lease_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      AUTH_MODE: disabled
      DATABASE_URL: postgresql+psycopg://lease_ci:lease_ci_password@127.0.0.1:5432/know_your_lease_ci
      ENVIRONMENT: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock

      - name: Install production dependencies
        run: python -m pip install --requirement requirements.txt --constraint requirements.lock

      - name: Check dependency integrity
        run: python -m pip check

      - name: Validate migration graph and single head
        run: |
          python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads(); assert len(heads) == 1, f'Expected exactly one Alembic head, found: {heads}'; print(f'Alembic head: {heads[0]}')"
          alembic history

      - name: Upgrade clean database to head
        run: alembic upgrade head

      - name: Verify database is at every head
        run: alembic current --check-heads

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: know-your-lease-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
